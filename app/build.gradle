plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.mama.helper'
    compileSdk 34

    defaultConfig {
        applicationId "ua.mama.helper"
        minSdk 21
        // 29 = Android 10: allows the cleaner to read the phone's memory on Redmi 9A
        targetSdk 29
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
